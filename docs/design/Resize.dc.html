<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>MyMail — 패널 너비 조절 상태</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:"Pretendard";src:url(/_blob/90b6419f48d00e757ad3a12ef030097e) format("woff2");font-weight:45 920;font-style:normal;font-display:swap}
body{margin:0}
.mm{
--font-sans:"Pretendard",-apple-system,"Segoe UI","Malgun Gothic",sans-serif;
--color-bg:#FFFFFF;--color-bg-subtle:#F7F7F8;--color-bg-hover:#EFEFF1;--color-bg-selected:#E8E8ED;
--color-border:#E7E7EA;--color-border-strong:#D4D4D8;
--color-text:#18181B;--color-text-secondary:#52525B;--color-text-tertiary:#6B6B74;
--color-accent:#4F46E5;--color-accent-text:#4F46E5;--color-on-accent:#FFFFFF;
--color-badge-bg:#18181B;--color-badge-text:#FFFFFF;--color-overlay:#18181B;--color-on-overlay:#FFFFFF;
--shadow-popup:0 8px 24px rgba(24,24,27,.10),0 0 0 1px rgba(24,24,27,.06);
--account-1:#2563EB;--account-2:#15803D;--account-3:#C2410C;--on-account:#FFFFFF;
}
.mm.dark{
--color-bg:#131316;--color-bg-subtle:#18181C;--color-bg-hover:#222227;--color-bg-selected:#2A2A31;
--color-border:#26262C;--color-border-strong:#34343C;
--color-text:#EDEDEF;--color-text-secondary:#A1A1AA;--color-text-tertiary:#8B8B94;
--color-accent:#5E5CE6;--color-accent-text:#A5A8FA;--color-on-accent:#FFFFFF;
--color-badge-bg:#EDEDEF;--color-badge-text:#131316;--color-overlay:#EDEDEF;--color-on-overlay:#131316;
--shadow-popup:0 8px 24px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.06);
--account-1:#60A5FA;--account-2:#4ADE80;--account-3:#FB923C;--on-account:#131316;
}
</style>
</helmet>
<div class="mm {{themeClass}}" style="width: 1440px; height: 620px; box-sizing: border-box; padding: 40px; background: var(--color-bg-subtle); color: var(--color-text); font-family: var(--font-sans); font-size: 14px; line-height: 1.5; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; align-items: baseline; gap: 16px">
<h1 style="margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.015em">패널 너비 조절</h1>
<span style="font-size: 14px; color: var(--color-text-secondary)">폴더 180–320px (기본 220) · 목록 300–520px (기본 360) · 본문 최소 480px</span>
</div>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; flex: 1; min-height: 0">

<!-- A 기본 -->
<figure style="margin: 0; display: flex; flex-direction: column; gap: 10px; min-width: 0">
<figcaption style="font-size: 12px; font-weight: 600; color: var(--color-text-secondary)">A · 기본 — 1px 구분선, 히트 영역 8px</figcaption>
<div style="flex: 1; display: flex; overflow: hidden; border-radius: 10px; background: var(--color-bg); box-shadow: 0 0 0 1px var(--color-border)">
<div style="width: 64px; flex: none; background: var(--color-bg-subtle); border-right: 1px solid var(--color-border); display: flex; flex-direction: column; align-items: center; gap: 16px; padding-top: 16px">
<span style="width: 40px; height: 40px; border-radius: 50%; background: var(--account-1); color: var(--on-account); font: 600 15px/40px var(--font-sans); text-align: center; box-shadow: 0 0 0 2px var(--color-bg-subtle), 0 0 0 4px var(--account-1)">개</span>
<span style="width: 40px; height: 40px; border-radius: 50%; background: var(--account-2); color: var(--on-account); font: 600 15px/40px var(--font-sans); text-align: center; box-shadow: 0 0 0 2px var(--color-bg-subtle), 0 0 0 4px var(--account-2)">프</span>
<span style="width: 40px; height: 40px; border-radius: 50%; background: var(--account-3); color: var(--on-account); font: 600 15px/40px var(--font-sans); text-align: center; box-shadow: 0 0 0 2px var(--color-bg-subtle), 0 0 0 4px var(--account-3)">네</span>
</div>
<div style="width: 220px; flex: none; background: var(--color-bg-subtle); padding: 16px 8px; display: flex; flex-direction: column; gap: 0">
<div style="padding: 0 8px 12px; font-weight: 600">개인 Gmail</div>
<sc-for list="{{folders}}" as="f" hint-placeholder-count="5"><div style="height: 32px; display: flex; align-items: center; gap: 10px; padding: 0 8px; border-radius: 6px; background: {{f.bg}}; color: {{f.color}}; font-weight: {{f.weight}}"><span style="width: 20px; height: 20px; display: flex; align-items: center; justify-content: center"><span style="width: 14px; height: 14px; border-radius: 4px; border: 1.75px solid currentColor; box-sizing: border-box"></span></span><span style="flex: 1">{{f.name}}</span><span style="font-size: 12px">{{f.count}}</span></div></sc-for>
</div>
<div style="width: 1px; flex: none; background: var(--color-border)"></div>
<div style="flex: 1; min-width: 0; padding: 16px 12px; display: flex; flex-direction: column; gap: 14px">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="4"><div style="min-width: 0"><div style="font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.s}}</div><div style="font-size: 12px; color: var(--color-text-tertiary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.t}}</div></div></sc-for>
</div>
</div>
</figure>

<!-- B 호버 -->
<figure style="margin: 0; display: flex; flex-direction: column; gap: 10px; min-width: 0">
<figcaption style="font-size: 12px; font-weight: 600; color: var(--color-text-secondary)">B · 호버/드래그 — 2px 강조선 + 좌우 화살표 커서</figcaption>
<div style="flex: 1; display: flex; overflow: hidden; border-radius: 10px; background: var(--color-bg); box-shadow: 0 0 0 1px var(--color-border); position: relative">
<div style="width: 64px; flex: none; background: var(--color-bg-subtle); border-right: 1px solid var(--color-border); display: flex; flex-direction: column; align-items: center; gap: 16px; padding-top: 16px">
<span style="width: 40px; height: 40px; border-radius: 50%; background: var(--account-1); color: var(--on-account); font: 600 15px/40px var(--font-sans); text-align: center; box-shadow: 0 0 0 2px var(--color-bg-subtle), 0 0 0 4px var(--account-1)">개</span>
<span style="width: 40px; height: 40px; border-radius: 50%; background: var(--account-2); color: var(--on-account); font: 600 15px/40px var(--font-sans); text-align: center; box-shadow: 0 0 0 2px var(--color-bg-subtle), 0 0 0 4px var(--account-2)">프</span>
<span style="width: 40px; height: 40px; border-radius: 50%; background: var(--account-3); color: var(--on-account); font: 600 15px/40px var(--font-sans); text-align: center; box-shadow: 0 0 0 2px var(--color-bg-subtle), 0 0 0 4px var(--account-3)">네</span>
</div>
<div style="width: 220px; flex: none; background: var(--color-bg-subtle); padding: 16px 8px; display: flex; flex-direction: column">
<div style="padding: 0 8px 12px; font-weight: 600">개인 Gmail</div>
<sc-for list="{{folders}}" as="f" hint-placeholder-count="5"><div style="height: 32px; display: flex; align-items: center; gap: 10px; padding: 0 8px; border-radius: 6px; background: {{f.bg}}; color: {{f.color}}; font-weight: {{f.weight}}"><span style="width: 20px; height: 20px; display: flex; align-items: center; justify-content: center"><span style="width: 14px; height: 14px; border-radius: 4px; border: 1.75px solid currentColor; box-sizing: border-box"></span></span><span style="flex: 1">{{f.name}}</span><span style="font-size: 12px">{{f.count}}</span></div></sc-for>
</div>
<div role="separator" aria-orientation="vertical" aria-valuenow="220" aria-valuemin="180" aria-valuemax="320" aria-label="폴더 패널 너비" style="width: 2px; margin: 0 -1px 0 -1px; flex: none; background: var(--color-accent); position: relative; z-index: 1"></div>
<div style="flex: 1; min-width: 0; padding: 16px 12px; display: flex; flex-direction: column; gap: 14px">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="4"><div style="min-width: 0"><div style="font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.s}}</div><div style="font-size: 12px; color: var(--color-text-tertiary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.t}}</div></div></sc-for>
</div>
<svg width="28" height="20" viewBox="0 0 28 20" aria-hidden="true" style="position: absolute; left: 270px; top: 200px; z-index: 2"><path d="M1.5 10 7 4.5V8h5V1.5h4V8h5V4.5L26.5 10 21 15.5V12h-5v6.5h-4V12H7v3.5z" fill="#111" stroke="#fff" stroke-width="1.25" stroke-linejoin="round"></path></svg>
<div style="position: absolute; left: 296px; top: 226px; z-index: 2; padding: 6px 10px; border-radius: 6px; background: var(--color-overlay); color: var(--color-on-overlay); font-size: 12px; line-height: 1.5; white-space: nowrap; box-shadow: var(--shadow-popup)"><b style="font-weight: 600">220px</b> · 더블클릭하면 기본 너비</div>
</div>
</figure>

<!-- C 접힘 -->
<figure style="margin: 0; display: flex; flex-direction: column; gap: 10px; min-width: 0">
<figcaption style="font-size: 12px; font-weight: 600; color: var(--color-text-secondary)">C · 180px 미만으로 줄이면 접힘(56px) — 핸들 호버</figcaption>
<div style="flex: 1; display: flex; overflow: hidden; border-radius: 10px; background: var(--color-bg); box-shadow: 0 0 0 1px var(--color-border); position: relative">
<div style="width: 64px; flex: none; background: var(--color-bg-subtle); border-right: 1px solid var(--color-border); display: flex; flex-direction: column; align-items: center; gap: 16px; padding-top: 16px">
<span style="width: 40px; height: 40px; border-radius: 50%; background: var(--account-1); color: var(--on-account); font: 600 15px/40px var(--font-sans); text-align: center; box-shadow: 0 0 0 2px var(--color-bg-subtle), 0 0 0 4px var(--account-1)">개</span>
<span style="width: 40px; height: 40px; border-radius: 50%; background: var(--account-2); color: var(--on-account); font: 600 15px/40px var(--font-sans); text-align: center; box-shadow: 0 0 0 2px var(--color-bg-subtle), 0 0 0 4px var(--account-2)">프</span>
<span style="width: 40px; height: 40px; border-radius: 50%; background: var(--account-3); color: var(--on-account); font: 600 15px/40px var(--font-sans); text-align: center; box-shadow: 0 0 0 2px var(--color-bg-subtle), 0 0 0 4px var(--account-3)">네</span>
</div>
<div style="width: 56px; flex: none; background: var(--color-bg-subtle); padding: 16px 8px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 4px">
<button aria-label="새 메일" style="width: 40px; height: 40px; border: 0; border-radius: 6px; background: var(--color-accent); color: var(--color-on-accent); display: flex; align-items: center; justify-content: center; margin-bottom: 8px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.375 2.625a1 1 0 0 1 3 3l-9.013 9.014a2 2 0 0 1-.853.505l-2.873.84a.5.5 0 0 1-.62-.62l.84-2.873a2 2 0 0 1 .506-.852z"></path></svg></button>
<button aria-label="받은편지함, 안 읽음 12" style="position: relative; width: 40px; height: 36px; border: 0; border-radius: 6px; background: var(--color-bg-selected); color: var(--color-text); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"></polyline><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"></path></svg><span style="position: absolute; top: 6px; right: 7px; width: 6px; height: 6px; border-radius: 50%; background: var(--color-accent)"></span></button>
<button aria-label="보낸편지함" style="width: 40px; height: 36px; border: 0; border-radius: 6px; background: transparent; color: var(--color-text-secondary); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4Z"></path><path d="M22 2 11 13"></path></svg></button>
<button aria-label="임시보관함" style="width: 40px; height: 36px; border: 0; border-radius: 6px; background: transparent; color: var(--color-text-secondary); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"></path><path d="M14 2v4a2 2 0 0 0 2 2h4"></path></svg></button>
<button aria-label="스팸" style="width: 40px; height: 36px; border: 0; border-radius: 6px; background: transparent; color: var(--color-text-secondary); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="7.86 2 16.14 2 22 7.86 22 16.14 16.14 22 7.86 22 2 16.14 2 7.86 7.86 2"></polygon><path d="M12 8v4"></path><path d="M12 16h.01"></path></svg></button>
<button aria-label="휴지통" style="width: 40px; height: 36px; border: 0; border-radius: 6px; background: transparent; color: var(--color-text-secondary); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path></svg></button>
<span style="width: 20px; height: 1px; background: var(--color-border-strong); margin: 8px 0"></span>
<span title="가족" style="width: 40px; height: 28px; display: flex; align-items: center; justify-content: center"><span style="width: 8px; height: 8px; border-radius: 50%; background: #BE185D"></span></span>
<span title="여행" style="width: 40px; height: 28px; display: flex; align-items: center; justify-content: center"><span style="width: 8px; height: 8px; border-radius: 50%; background: #0F766E"></span></span>
<span title="금융" style="width: 40px; height: 28px; display: flex; align-items: center; justify-content: center"><span style="width: 8px; height: 8px; border-radius: 50%; background: #A16207"></span></span>
</div>
<div role="separator" aria-orientation="vertical" aria-valuenow="56" aria-label="폴더 패널 너비 (접힘)" style="width: 2px; margin: 0 -1px; flex: none; background: var(--color-accent); position: relative; z-index: 1"></div>
<div style="flex: 1; min-width: 0; padding: 16px 12px; display: flex; flex-direction: column; gap: 14px">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="4"><div style="min-width: 0"><div style="font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.s}}</div><div style="font-size: 12px; color: var(--color-text-tertiary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.t}}</div></div></sc-for>
</div>
<svg width="28" height="20" viewBox="0 0 28 20" aria-hidden="true" style="position: absolute; left: 106px; top: 300px; z-index: 2"><path d="M1.5 10 7 4.5V8h5V1.5h4V8h5V4.5L26.5 10 21 15.5V12h-5v6.5h-4V12H7v3.5z" fill="#111" stroke="#fff" stroke-width="1.25" stroke-linejoin="round"></path></svg>
<div style="position: absolute; left: 132px; top: 326px; z-index: 2; padding: 6px 10px; border-radius: 6px; background: var(--color-overlay); color: var(--color-on-overlay); font-size: 12px; line-height: 1.5; white-space: nowrap; box-shadow: var(--shadow-popup)">오른쪽으로 끌어 펼치기 · 더블클릭 220px</div>
</div>
</figure>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":620}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const f = (name, count, sel) => ({ name, count, bg: sel ? 'var(--color-bg-selected)' : 'transparent', color: sel ? 'var(--color-text)' : 'var(--color-text-secondary)', weight: sel ? '600' : '400' });
    return {
      themeClass: dark ? 'dark' : '',
      folders: [f('받은편지함', '12', true), f('보낸편지함', '', false), f('임시보관함', '2', false), f('스팸', '4', false), f('휴지통', '', false)],
      rows: [
        { s: '누리택배', t: '[누리택배] 오늘 14~16시 사이 배송 예정입니다' },
        { s: '이서연', t: '이번 주 토요일 북한산 갈래?' },
        { s: '김도윤', t: '10월 가족여행 일정표랑 항공권 보내줄게' },
        { s: '한결카드', t: '[한결카드] 2026년 9월 이용대금 명세서' },
        { s: '주간 테크레터', t: 'AI 에이전트가 바꾸는 개발 워크플로' }
      ]
    };
  }
}
</script>
</body>
</html>
