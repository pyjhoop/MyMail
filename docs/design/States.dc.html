<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>MyMail — 상태 화면</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:"Pretendard";src:url(/_blob/90b6419f48d00e757ad3a12ef030097e) format("woff2");font-weight:45 920;font-style:normal;font-display:swap}
body{margin:0}
.mm{
--font-sans:"Pretendard",-apple-system,"Segoe UI","Malgun Gothic",sans-serif;
--color-bg:#FFFFFF;--color-bg-subtle:#F7F7F8;--color-bg-hover:#EFEFF1;--color-bg-selected:#E8E8ED;
--color-border:#E7E7EA;--color-border-strong:#D4D4D8;
--color-text:#18181B;--color-text-secondary:#52525B;--color-text-tertiary:#6B6B74;
--color-accent:#4F46E5;--color-accent-text:#4F46E5;--color-accent-subtle:#EEEEFD;--color-on-accent:#FFFFFF;
--color-badge-bg:#18181B;--color-badge-text:#FFFFFF;
--color-danger:#DC2626;--color-danger-text:#B91C1C;--color-danger-subtle:#FEF0F0;
--color-warning-text:#B45309;--color-warning-subtle:#FFF7E6;
--color-overlay:#18181B;--color-on-overlay:#FFFFFF;--color-overlay-accent:#A5A8FA;--color-overlay-danger:#FCA5A5;
--shadow-popup:0 8px 24px rgba(24,24,27,.10),0 0 0 1px rgba(24,24,27,.06);
--account-1:#2563EB;--account-2:#15803D;--account-3:#C2410C;--on-account:#FFFFFF;
}
.mm.dark{
--color-bg:#131316;--color-bg-subtle:#18181C;--color-bg-hover:#222227;--color-bg-selected:#2A2A31;
--color-border:#26262C;--color-border-strong:#34343C;
--color-text:#EDEDEF;--color-text-secondary:#A1A1AA;--color-text-tertiary:#8B8B94;
--color-accent:#5E5CE6;--color-accent-text:#A5A8FA;--color-accent-subtle:#23234A;--color-on-accent:#FFFFFF;
--color-badge-bg:#EDEDEF;--color-badge-text:#131316;
--color-danger:#F87171;--color-danger-text:#FCA5A5;--color-danger-subtle:#3A1C1E;
--color-warning-text:#FBBF24;--color-warning-subtle:#2E2410;
--color-overlay:#EDEDEF;--color-on-overlay:#131316;--color-overlay-accent:#4F46E5;--color-overlay-danger:#B91C1C;
--shadow-popup:0 8px 24px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.06);
--account-1:#60A5FA;--account-2:#4ADE80;--account-3:#FB923C;--on-account:#131316;
}
.mm button{font-family:inherit;cursor:pointer}
.mm a{color:var(--color-accent-text);text-decoration:none;font-weight:600}
@keyframes mmpulse{0%,100%{opacity:1}50%{opacity:.55}}
@keyframes mmspin{to{transform:rotate(360deg)}}
.mm kbd{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;box-sizing:border-box;border-radius:4px;border:1px solid var(--color-border-strong);border-bottom-width:2px;font:600 12px/1 var(--font-sans);color:var(--color-text-secondary);background:var(--color-bg)}
</style>
</helmet>
<div class="mm {{themeClass}}" style="width: 1600px; height: 1440px; box-sizing: border-box; padding: 40px; display: flex; flex-direction: column; gap: 24px; background: var(--color-bg-subtle); color: var(--color-text); font-family: var(--font-sans); font-size: 14px; line-height: 1.5; letter-spacing: -0.005em">
<h1 style="margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.015em">상태 화면</h1>
<div style="flex: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 48px 40px">

<!-- 1 로딩 -->
<figure style="margin: 0; display: flex; flex-direction: column; gap: 10px; min-height: 0">
<figcaption style="font-size: 12px; font-weight: 600; color: var(--color-text-secondary)">로딩 스켈레톤 — 목록 · 본문</figcaption>
<div aria-busy="true" style="flex: 1; display: flex; overflow: hidden; border-radius: 10px; background: var(--color-bg); box-shadow: 0 0 0 1px var(--color-border)">
<div style="width: 340px; flex: none; display: flex; flex-direction: column">
<div style="height: 48px; display: flex; align-items: center; gap: 8px; padding: 0 20px"><b style="font-size: 16px; font-weight: 700">받은편지함</b><span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--color-text-tertiary)"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true" style="animation: mmspin 1s linear infinite"><path d="M21 12a9 9 0 1 1-6.22-8.56"></path></svg>불러오는 중</span></div>
<div style="display: flex; flex-direction: column; gap: 22px; padding: 8px 20px; animation: mmpulse 1.6s ease-in-out infinite">
<sc-for list="{{skel}}" as="s" hint-placeholder-count="7">
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; gap: 12px"><span style="height: 12px; width: {{s.a}}; border-radius: 4px; background: var(--color-bg-selected)"></span><span style="flex: 1"></span><span style="height: 10px; width: 44px; border-radius: 4px; background: var(--color-bg-hover)"></span></div>
<span style="height: 12px; width: {{s.b}}; border-radius: 4px; background: var(--color-bg-hover)"></span>
<span style="height: 10px; width: {{s.c}}; border-radius: 4px; background: var(--color-bg-hover)"></span>
</div>
</sc-for>
</div>
</div>
<div style="flex: 1; border-left: 1px solid var(--color-border); padding: 64px 20px; display: flex; flex-direction: column; gap: 12px; animation: mmpulse 1.6s ease-in-out infinite"><span style="height: 16px; width: 90%; border-radius: 4px; background: var(--color-bg-selected)"></span><span style="height: 10px; width: 60%; border-radius: 4px; background: var(--color-bg-hover)"></span><span style="height: 10px; width: 80%; border-radius: 4px; background: var(--color-bg-hover); margin-top: 16px"></span><span style="height: 10px; width: 70%; border-radius: 4px; background: var(--color-bg-hover)"></span></div>
</div>
</figure>

<!-- 2 빈 폴더 -->
<figure style="margin: 0; display: flex; flex-direction: column; gap: 10px; min-height: 0">
<figcaption style="font-size: 12px; font-weight: 600; color: var(--color-text-secondary)">빈 폴더</figcaption>
<div style="flex: 1; display: flex; flex-direction: column; overflow: hidden; border-radius: 10px; background: var(--color-bg); box-shadow: 0 0 0 1px var(--color-border)">
<div style="height: 48px; display: flex; align-items: center; gap: 8px; padding: 0 20px"><b style="font-size: 16px; font-weight: 700">스팸</b><span style="font-size: 12px; color: var(--color-text-tertiary)">개인 Gmail</span></div>
<div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; gap: 6px">
<span style="width: 48px; height: 48px; border-radius: 50%; background: var(--color-bg-hover); color: var(--color-text-tertiary); display: flex; align-items: center; justify-content: center; margin-bottom: 10px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span>
<b style="font-size: 14px; font-weight: 600">스팸함이 비어 있어요</b>
<span style="font-size: 12px; color: var(--color-text-tertiary)">스팸으로 분류된 메일은 30일 뒤 자동으로 지워져요.</span>
</div>
</div>
</figure>

<!-- 3 미선택 -->
<figure style="margin: 0; display: flex; flex-direction: column; gap: 10px; min-height: 0">
<figcaption style="font-size: 12px; font-weight: 600; color: var(--color-text-secondary)">메일 미선택 — 본문 영역 단축키 힌트</figcaption>
<div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; border-radius: 10px; background: var(--color-bg); box-shadow: 0 0 0 1px var(--color-border); padding: 24px">
<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--color-text-tertiary); margin-bottom: 14px"><rect width="20" height="16" x="2" y="4" rx="2"></rect><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path></svg>
<b style="font-size: 16px; font-weight: 600">메일을 선택하세요</b>
<span style="font-size: 12px; color: var(--color-text-tertiary); margin: 4px 0 24px">받은편지함에 안 읽은 메일 12개</span>
<dl style="margin: 0; display: grid; grid-template-columns: auto auto; column-gap: 16px; row-gap: 10px; align-items: center; font-size: 12px">
<sc-for list="{{keys}}" as="k" hint-placeholder-count="6"><dt style="display: flex; gap: 4px; justify-content: flex-end"><kbd>{{k.a}}</kbd><sc-if value="{{k.b}}" hint-placeholder-val="{{false}}"><kbd>{{k.b}}</kbd></sc-if></dt><dd style="margin: 0; color: var(--color-text-secondary)">{{k.label}}</dd></sc-for>
</dl>
</div>
</figure>

<!-- 4 오프라인 -->
<figure style="margin: 0; display: flex; flex-direction: column; gap: 10px; min-height: 0">
<figcaption style="font-size: 12px; font-weight: 600; color: var(--color-text-secondary)">오프라인 배너 — 저장된 메일은 계속 읽기 가능</figcaption>
<div style="flex: 1; display: flex; flex-direction: column; overflow: hidden; border-radius: 10px; background: var(--color-bg); box-shadow: 0 0 0 1px var(--color-border)">
<div style="height: 40px; flex: none; display: flex; align-items: center; justify-content: flex-end; padding: 0 16px; background: var(--color-bg-subtle); border-bottom: 1px solid var(--color-border)"><span style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--color-warning-text)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h.01"></path><path d="M8.5 16.43a5 5 0 0 1 7 0"></path><path d="M5 12.86a10 10 0 0 1 5.17-2.69"></path><path d="M19 12.86a10 10 0 0 0-2-1.52"></path><path d="M2 8.82a15 15 0 0 1 4.18-2.64"></path><path d="M22 8.82a15 15 0 0 0-11.29-3.76"></path><path d="m2 2 20 20"></path></svg>오프라인</span></div>
<div role="status" style="display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--color-warning-subtle); color: var(--color-warning-text)">
<span style="flex: 1; font-size: 12px; line-height: 1.5"><b style="font-weight: 600">인터넷에 연결되어 있지 않아요.</b> 저장된 메일은 볼 수 있고, 보낼 메일 1개는 연결되면 자동으로 보내요.</span>
<button style="height: 28px; flex: none; padding: 0 10px; border: 1px solid currentColor; border-radius: 6px; background: transparent; color: inherit; font-size: 12px; font-weight: 600">다시 연결</button>
</div>
<div style="padding: 8px; display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{offRows}}" as="m" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; padding: 10px 12px 10px 28px; border-radius: 6px">
<div style="display: flex"><span style="flex: 1; font-weight: {{m.w}}; color: {{m.color}}">{{m.sender}}</span><span style="font-size: 12px; color: var(--color-text-tertiary)">{{m.time}}</span></div>
<span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: {{m.color}}">{{m.subject}}</span>
</div>
</sc-for>
</div>
</div>
</figure>

<!-- 5 인증 오류 -->
<figure style="margin: 0; display: flex; flex-direction: column; gap: 10px; min-height: 0">
<figcaption style="font-size: 12px; font-weight: 600; color: var(--color-text-secondary)">인증 오류 — 아바타 경고 + 다시 로그인 배너</figcaption>
<div style="flex: 1; display: flex; overflow: hidden; border-radius: 10px; background: var(--color-bg); box-shadow: 0 0 0 1px var(--color-border); position: relative">
<div style="width: 64px; flex: none; display: flex; flex-direction: column; align-items: center; gap: 20px; padding-top: 20px; background: var(--color-bg-subtle); border-right: 1px solid var(--color-border)">
<span style="width: 40px; height: 40px; border-radius: 50%; background: var(--account-1); color: var(--on-account); font: 600 15px/40px var(--font-sans); text-align: center; box-shadow: 0 0 0 2px var(--color-bg-subtle), 0 0 0 4px var(--account-1)">개</span>
<span style="width: 40px; height: 40px; border-radius: 50%; background: var(--account-2); color: var(--on-account); font: 600 15px/40px var(--font-sans); text-align: center; box-shadow: 0 0 0 2px var(--color-bg-subtle), 0 0 0 4px var(--account-2)">프</span>
<span style="position: relative; width: 64px; display: flex; justify-content: center">
<span style="position: absolute; left: 0; top: 8px; width: 3px; height: 24px; border-radius: 0 3px 3px 0; background: var(--color-text)"></span>
<span aria-label="네이버 · 다시 로그인 필요" style="position: relative; width: 40px; height: 40px; border-radius: 50%; background: var(--account-3); color: var(--on-account); font: 600 15px/40px var(--font-sans); text-align: center; box-shadow: 0 0 0 2px var(--color-bg-subtle), 0 0 0 4px var(--account-3); filter: saturate(.35); opacity: .75">네</span>
<span aria-hidden="true" style="position: absolute; left: 38px; bottom: -4px; width: 18px; height: 18px; border-radius: 50%; background: var(--color-danger); color: #FFFFFF; font: 800 12px/18px var(--font-sans); text-align: center; box-shadow: 0 0 0 2px var(--color-bg-subtle)">!</span>
</span>
</div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<div role="alert" style="display: flex; gap: 10px; padding: 12px 16px; background: var(--color-danger-subtle); color: var(--color-danger-text)">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px"><rect width="18" height="11" x="3" y="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
<div style="flex: 1; font-size: 12px; line-height: 1.55"><b style="display: block; font-size: 14px; font-weight: 600">네이버 계정에 다시 로그인해야 해요</b>비밀번호가 바뀌었거나 애플리케이션 비밀번호가 만료됐어요. 10월 9일 오전 8:12 이후 새 메일을 가져오지 못했어요.
<div style="margin-top: 10px; display: flex; gap: 8px"><button style="height: 28px; padding: 0 12px; border: 0; border-radius: 6px; background: var(--color-accent); color: var(--color-on-accent); font-size: 12px; font-weight: 600">다시 로그인</button><button style="height: 28px; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; color: inherit; font-size: 12px; font-weight: 600">나중에</button></div></div>
</div>
<div style="height: 44px; display: flex; align-items: center; padding: 0 20px; gap: 8px"><b style="font-size: 16px; font-weight: 700">받은편지함</b><span style="font-size: 12px; color: var(--color-text-tertiary)">네이버 · 오전 8:12까지 동기화</span></div>
<div style="padding: 0 8px; opacity: .6">
<sc-for list="{{naverRows}}" as="m" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; padding: 10px 12px"><div style="display: flex"><span style="flex: 1">{{m.sender}}</span><span style="font-size: 12px; color: var(--color-text-tertiary)">{{m.time}}</span></div><span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--color-text-secondary)">{{m.subject}}</span></div>
</sc-for>
</div>
</div>
</div>
</figure>

<!-- 6 발송 실패 -->
<figure style="margin: 0; display: flex; flex-direction: column; gap: 10px; min-height: 0">
<figcaption style="font-size: 12px; font-weight: 600; color: var(--color-text-secondary)">발송 실패 — 보낼편지함 행 + 토스트</figcaption>
<div style="flex: 1; display: flex; flex-direction: column; overflow: hidden; border-radius: 10px; background: var(--color-bg); box-shadow: 0 0 0 1px var(--color-border); position: relative">
<div style="height: 48px; display: flex; align-items: center; gap: 8px; padding: 0 20px"><b style="font-size: 16px; font-weight: 700">보낼편지함</b><span style="font-size: 12px; color: var(--color-text-tertiary)">2개</span></div>
<div style="padding: 0 8px; display: flex; flex-direction: column; gap: 2px">
<div style="display: flex; flex-direction: column; gap: 2px; padding: 10px 12px 10px 16px; border-radius: 6px; position: relative; background: var(--color-bg-selected)">
<span style="position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 0 3px 3px 0; background: var(--account-3)"></span>
<div style="display: flex; align-items: center; gap: 6px"><span style="flex: 1; font-weight: 600">받는사람: 한빛이사 상담팀</span><span style="height: 20px; display: inline-flex; align-items: center; gap: 4px; padding: 0 6px; border-radius: 6px; background: var(--color-danger-subtle); color: var(--color-danger-text); font-size: 12px; font-weight: 600"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4M12 16h.01"></path></svg>발송 실패</span></div>
<span>이사 견적 요청드립니다 (11/15, 망원동 → 성산동)</span>
<span style="font-size: 12px; color: var(--color-danger-text)">첨부 파일이 너무 커요 (28.4 MB) · <a href="#retry">다시 보내기</a> · <a href="#edit">수정</a></span>
</div>
<div style="display: flex; flex-direction: column; gap: 2px; padding: 10px 12px 10px 16px; border-radius: 6px; position: relative">
<span style="position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 0 3px 3px 0; background: var(--account-1)"></span>
<div style="display: flex; align-items: center; gap: 6px"><span style="flex: 1; font-weight: 600">받는사람: 이서연</span><span style="display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--color-text-tertiary)"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true" style="animation: mmspin 1s linear infinite"><path d="M21 12a9 9 0 1 1-6.22-8.56"></path></svg>보내는 중</span></div>
<span style="color: var(--color-text-secondary)">Re: 이번 주 토요일 북한산 갈래?</span>
</div>
</div>
<div role="alert" style="position: absolute; left: 16px; right: 16px; bottom: 16px; display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 8px 8px 8px 14px; border-radius: 10px; background: var(--color-overlay); color: var(--color-on-overlay); box-shadow: var(--shadow-popup); font-size: 14px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: var(--color-overlay-danger)"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4M12 16h.01"></path></svg>
<span style="flex: 1; line-height: 1.4">보내지 못했어요<span style="display: block; font-size: 12px; opacity: .7">네이버 · 첨부 용량 초과</span></span>
<button style="height: 28px; border: 0; border-radius: 6px; background: transparent; color: var(--color-overlay-accent); font-size: 14px; font-weight: 600; padding: 0 8px">다시 보내기</button>
<button aria-label="닫기" style="width: 28px; height: 28px; border: 0; border-radius: 6px; background: transparent; color: inherit; opacity: .7; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
</div>
</div>
</figure>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1600,"height":1440}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const skel = [['38%', '82%', '64%'], ['30%', '70%', '58%'], ['44%', '88%', '50%'], ['26%', '76%', '68%'], ['36%', '64%', '54%'], ['32%', '80%', '60%'], ['40%', '72%', '48%']].map(([a, b, c]) => ({ a, b, c }));
    const keys = [
      { a: 'J', b: 'K', label: '다음 · 이전 메일' }, { a: 'Enter', b: false, label: '메일 열기' }, { a: 'E', b: false, label: '보관' },
      { a: 'R', b: false, label: '답장' }, { a: 'C', b: false, label: '새 메일' }, { a: '/', b: false, label: '검색' }, { a: '?', b: false, label: '모든 단축키 보기' }
    ];
