<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>MyMail — 별도 창 작성기</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:"Pretendard";src:url(/_blob/90b6419f48d00e757ad3a12ef030097e) format("woff2");font-weight:45 920;font-style:normal;font-display:swap}
body{margin:0}
.mm{
--font-sans:"Pretendard",-apple-system,"Segoe UI","Malgun Gothic",sans-serif;
--desk:#DCDDE3;--desk-text:#3F3F46;
--color-bg:#FFFFFF;--color-bg-subtle:#F7F7F8;--color-bg-hover:#EFEFF1;--color-bg-selected:#E8E8ED;
--color-border:#E7E7EA;--color-border-strong:#D4D4D8;
--color-text:#18181B;--color-text-secondary:#52525B;--color-text-tertiary:#6B6B74;
--color-accent:#4F46E5;--color-accent-hover:#4338CA;--color-accent-text:#4F46E5;--color-accent-subtle:#EEEEFD;--color-on-accent:#FFFFFF;
--shadow-popup:0 8px 24px rgba(24,24,27,.10),0 0 0 1px rgba(24,24,27,.06);
--shadow-window:0 16px 48px rgba(24,24,27,.22),0 0 0 1px rgba(24,24,27,.08);
--focus-ring:0 0 0 1px var(--color-accent),0 0 0 4px var(--color-accent-subtle);
--account-1:#2563EB;--account-2:#15803D;--account-3:#C2410C;--account-8:#B91C1C;--on-account:#FFFFFF;
}
.mm.dark{
--desk:#0A0A0C;--desk-text:#A1A1AA;
--color-bg:#131316;--color-bg-subtle:#18181C;--color-bg-hover:#222227;--color-bg-selected:#2A2A31;
--color-border:#26262C;--color-border-strong:#34343C;
--color-text:#EDEDEF;--color-text-secondary:#A1A1AA;--color-text-tertiary:#8B8B94;
--color-accent:#5E5CE6;--color-accent-hover:#6E6CF0;--color-accent-text:#A5A8FA;--color-accent-subtle:#23234A;--color-on-accent:#FFFFFF;
--shadow-popup:0 8px 24px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.06);
--shadow-window:0 16px 48px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.08);
--account-1:#60A5FA;--account-2:#4ADE80;--account-3:#FB923C;--account-8:#F87171;--on-account:#131316;
}
.mm button{font-family:inherit;cursor:pointer}
.mm .ib:hover{background:var(--color-bg-hover)}
@keyframes mmspin{to{transform:rotate(360deg)}}
</style>
</helmet>
<div class="mm {{themeClass}}" style="width: 1680px; height: 900px; box-sizing: border-box; padding: 36px 60px; display: flex; gap: 80px; background: var(--desk); color: var(--color-text); font-family: var(--font-sans); font-size: 14px; line-height: 1.5; letter-spacing: -0.005em">

<!-- 창 A -->
<figure style="margin: 0; display: flex; flex-direction: column; gap: 12px">
<figcaption style="font-size: 12px; font-weight: 600; color: var(--desk-text)">A · 보내는 계정 드롭다운 열림 · 받는사람/참조/숨은참조 · 첨부 업로드 중 · 임시저장 중</figcaption>
<div style="width: 760px; height: 800px; display: flex; flex-direction: column; border-radius: 8px; overflow: hidden; background: var(--color-bg); box-shadow: var(--shadow-window); position: relative">
<div style="height: 40px; flex: none; display: flex; align-items: center; background: var(--color-bg-subtle); border-bottom: 1px solid var(--color-border)">
<span style="flex: 1; padding-left: 16px; font-size: 12px; font-weight: 600">11월 모임 장소 투표해 줘</span>
<button class="ib" aria-label="최소화" style="width: 46px; height: 40px; border: 0; background: transparent; color: var(--color-text-secondary); display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" aria-hidden="true"><path d="M6 12h12"></path></svg></button>
<button class="ib" aria-label="최대화" style="width: 46px; height: 40px; border: 0; background: transparent; color: var(--color-text-secondary); display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1"></rect></svg></button>
<button class="ib" aria-label="닫기" style="width: 46px; height: 40px; border: 0; background: transparent; color: var(--color-text-secondary); display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17"></path></svg></button>
</div>

<div style="display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 20px; border-bottom: 1px solid var(--color-border)">
<span style="width: 64px; font-size: 12px; color: var(--color-text-tertiary)">보낸사람</span>
<button aria-haspopup="listbox" aria-expanded="true" style="height: 32px; border: 0; border-radius: 6px; background: var(--color-bg); box-shadow: var(--focus-ring); color: var(--color-text); display: flex; align-items: center; gap: 8px; padding: 0 8px 0 6px; font-size: 14px"><span style="width: 20px; height: 20px; border-radius: 50%; background: var(--account-1); color: var(--on-account); font: 600 10px/20px var(--font-sans); text-align: center">개</span><b style="font-weight: 600">개인 Gmail</b><span style="font-size: 12px; color: var(--color-text-tertiary)">junho.park@gmail.com</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--color-text-tertiary)"><path d="m18 15-6-6-6 6"></path></svg></button>
</div>
<sc-for list="{{recip}}" as="r" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 6px; min-height: 40px; padding: 4px 20px; border-bottom: 1px solid var(--color-border); flex-wrap: wrap">
<span style="width: 64px; font-size: 12px; color: var(--color-text-tertiary)">{{r.label}}</span>
<sc-for list="{{r.chips}}" as="c" hint-placeholder-count="2"><span style="height: 24px; display: inline-flex; align-items: center; gap: 6px; padding: 0 4px 0 3px; border-radius: 999px; background: var(--color-bg-hover); font-size: 12px"><span style="width: 18px; height: 18px; border-radius: 50%; background: var(--color-bg-selected); color: var(--color-text-secondary); font: 600 10px/18px var(--font-sans); text-align: center">{{c.n}}</span>{{c.name}}<button aria-label="삭제" style="width: 16px; height: 16px; border: 0; padding: 0; border-radius: 50%; background: transparent; color: var(--color-text-tertiary); display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></span></sc-for>
<input aria-label="{{r.label}} 추가" style="flex: 1; min-width: 60px; border: 0; outline: none; background: transparent; font: 400 14px/1 var(--font-sans); color: var(--color-text)">
</div>
</sc-for>
<div style="display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 20px; border-bottom: 1px solid var(--color-border)">
<span style="width: 64px; font-size: 12px; color: var(--color-text-tertiary)">제목</span>
<span style="font-size: 14px; font-weight: 600">11월 모임 장소 투표해 줘</span>
</div>
<div role="toolbar" aria-label="서식" style="display: flex; align-items: center; gap: 2px; padding: 4px 14px; border-bottom: 1px solid var(--color-border)">
<button class="ib" style="height: 28px; border: 0; border-radius: 6px; background: transparent; color: var(--color-text-secondary); display: flex; align-items: center; gap: 4px; padding: 0 8px; font-size: 12px">기본 글꼴<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
<button class="ib" style="height: 28px; border: 0; border-radius: 6px; background: transparent; color: var(--color-text-secondary); display: flex; align-items: center; gap: 4px; padding: 0 8px; font-size: 12px">14<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
<span style="width: 1px; height: 16px; background: var(--color-border); margin: 0 4px"></span>
<button class="ib" aria-label="굵게" style="width: 28px; height: 28px; border: 0; border-radius: 6px; background: transparent; color: var(--color-text-secondary); display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 12h9a4 4 0 0 1 0 8H7a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h7a4 4 0 0 1 0 8"></path></svg></button>
<button class="ib" aria-label="기울임" style="width: 28px; height: 28px; border: 0; border-radius: 6px; background: transparent; color: var(--color-text-secondary); display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 4h-9M14 20H5M15 4 9 20"></path></svg></button>
<button class="ib" aria-label="밑줄" style="width: 28px; height: 28px; border: 0; border-radius: 6px; background: transparent; color: var(--color-text-secondary); display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4v6a6 6 0 0 0 12 0V4"></path><path d="M4 20h16"></path></svg></button>
<span style="width: 1px; height: 16px; background: var(--color-border); margin: 0 4px"></span>
<button class="ib" aria-label="글머리 기호 목록" aria-pressed="true" style="width: 28px; height: 28px; border: 0; border-radius: 6px; background: var(--color-bg-selected); color: var(--color-text); display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h.01M3 12h.01M3 18h.01M8 6h13M8 12h13M8 18h13"></path></svg></button>
<button class="ib" aria-label="번호 목록" style="width: 28px; height: 28px; border: 0; border-radius: 6px; background: transparent; color: var(--color-text-secondary); display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 6h11M10 12h11M10 18h11M4 6h1v4M4 10h2M6 18H4c0-1 2-2 2-3s-1-1.5-2-1"></path></svg></button>
<button class="ib" aria-label="링크" style="width: 28px; height: 28px; border: 0; border-radius: 6px; background: transparent; color: var(--color-text-secondary); display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg></button>
<button class="ib" aria-label="이미지 넣기" style="width: 28px; height: 28px; border: 0; border-radius: 6px; background: transparent; color: var(--color-text-secondary); display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"></rect><circle cx="9" cy="9" r="2"></circle><path d="m21 15-3.09-3.09a2 2 0 0 0-2.82 0L6 21"></path></svg></button>
<button class="ib" aria-label="파일 첨부" style="width: 28px; height: 28px; border: 0; border-radius: 6px; background: transparent; color: var(--color-text-secondary); display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg></button>
</div>
<div role="textbox" aria-multiline="true" aria-label="본문" style="flex: 1; min-height: 0; padding: 16px 24px; font-size: 14px; line-height: 1.7">
<p style="margin: 0 0 8px">얘들아, 11월 모임 장소 후보 세 군데 정리했어.</p>
<ul style="margin: 0 0 8px; padding-left: 20px">
<li>성수 — 루프탑 있는 이탈리안</li>
<li>을지로 — 노포 고깃집 (6인 룸)</li>
<li>망원 — 와인바, 2차까지 가능</li>
</ul>
<p style="margin: 0">금요일까지 투표 부탁해! 예약은 내가 할게.</p>
</div>
<div style="display: flex; gap: 8px; padding: 0 24px 16px">
<div style="width: 240px; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--color-border)">
<span style="width: 32px; height: 32px; flex: none; border-radius: 6px; background: var(--color-bg-hover); color: var(--account-8); font: 700 10px/32px var(--font-sans); text-align: center">PDF</span>
<span style="flex: 1; min-width: 0"><span style="display: block; font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">장소후보_정리.pdf</span><span style="display: block; font-size: 12px; color: var(--color-text-tertiary)">1.1 MB</span></span>
<button class="ib" aria-label="첨부 삭제" style="width: 24px; height: 24px; border: 0; border-radius: 6px; background: transparent; color: var(--color-text-tertiary); display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
</div>
<div style="width: 240px; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--color-border)">
<span style="width: 32px; height: 32px; flex: none; border-radius: 6px; background: var(--color-bg-hover); color: var(--account-1); font: 700 10px/32px var(--font-sans); text-align: center">PNG</span>
<span style="flex: 1; min-width: 0"><span style="display: block; font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">지도_캡처.png</span><span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--color-text-tertiary)"><span role="progressbar" aria-valuenow="64" aria-valuemin="0" aria-valuemax="100" style="flex: 1; height: 4px; border-radius: 2px; background: var(--color-bg-selected); overflow: hidden"><span style="display: block; width: 64%; height: 4px; background: var(--color-accent)"></span></span>2.0 / 3.2 MB</span></span>
<button class="ib" aria-label="업로드 취소" style="width: 24px; height: 24px; border: 0; border-radius: 6px; background: transparent; color: var(--color-text-tertiary); display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
</div>
</div>
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-top: 1px solid var(--color-border)">
<span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--color-text-tertiary)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" aria-hidden="true" style="animation: mmspin 1s linear infinite"><path d="M21 12a9 9 0 1 1-6.22-8.56"></path></svg>임시저장 중…</span>
<span style="flex: 1"></span>
<span style="font-size: 12px; color: var(--color-text-tertiary)">Ctrl + Enter</span>
<div style="display: flex; border-radius: 6px; overflow: hidden">
<button style="height: 36px; border: 0; background: var(--color-accent); color: var(--color-on-accent); display: flex; align-items: center; gap: 6px; padding: 0 16px; font-size: 14px; font-weight: 600"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4Z"></path><path d="M22 2 11 13"></path></svg>보내기</button>
<button aria-label="예약 발송" style="width: 32px; height: 36px; border: 0; border-left: 1px solid rgba(255,255,255,.28); background: var(--color-accent); color: var(--color-on-accent); display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
</div>
</div>

<!-- 보내는 계정 드롭다운 -->
<div role="listbox" aria-label="보내는 계정" style="position: absolute; left: 92px; top: 86px; width: 340px; padding: 4px; border-radius: 10px; background: var(--color-bg); box-shadow: var(--shadow-popup); z-index: 3">
<sc-for list="{{fromAccounts}}" as="a" hint-placeholder-count="3">
<div role="option" aria-selected="{{a.sel}}" style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 10px; border-radius: 6px; background: {{a.bg}}">
<span style="width: 28px; height: 28px; flex: none; border-radius: 50%; background: {{a.c}}; color: var(--on-account); font: 600 12px/28px var(--font-sans); text-align: center; box-shadow: 0 0 0 2px var(--color-bg), 0 0 0 3.5px {{a.c}}">{{a.n}}</span>
<span style="flex: 1; min-width: 0; line-height: 1.35"><span style="display: block; font-size: 14px; font-weight: 600">{{a.name}}</span><span style="display: block; font-size: 12px; color: var(--color-text-tertiary)">{{a.email}}</span></span>
<sc-if value="{{a.check}}" hint-placeholder-val="{{false}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--color-accent-text)"><path d="M20 6 9 17l-5-5"></path></svg></sc-if>
</div>
</sc-for>
<div style="padding: 8px 10px 6px; margin-top: 4px; border-top: 1px solid var(--color-border); font-size: 12px; color: var(--color-text-tertiary)">답장할 때는 메일을 받은 계정이 자동으로 선택돼요</div>
</div>
</div>
</figure>

<!-- 창 B -->
<figure style="margin: 0; display: flex; flex-direction: column; gap: 12px">
<figcaption style="font-size: 12px; font-weight: 600; color: var(--desk-text)">B · 파일 드래그 앤 드롭 중 · 예약 발송 메뉴 열림 · 임시저장됨</figcaption>
<div style="width: 760px; height: 800px; display: flex; flex-direction: column; border-radius: 8px; overflow: hidden; background: var(--color-bg); box-shadow: var(--shadow-window); position: relative">
<div style="height: 40px; flex: none; display: flex; align-items: center; background: var(--color-bg-subtle); border-bottom: 1px solid var(--color-border)">
<span style="flex: 1; padding-left: 16px; font-size: 12px; font-weight: 600">이사 견적 요청드립니다</span>
<button class="ib" aria-label="최소화" style="width: 46px; height: 40px; border: 0; background: transparent; color: var(--color-text-secondary); display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" aria-hidden="true"><path d="M6 12h12"></path></svg></button>
<button class="ib" aria-label="최대화" style="width: 46px; height: 40px; border: 0; background: transparent; color: var(--color-text-secondary); display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1"></rect></svg></button>
<button class="ib" aria-label="닫기" style="width: 46px; height: 40px; border: 0; background: transparent; color: var(--color-text-secondary); display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17"></path></svg></button>
</div>
