[package]
name = "mymail"
version = "0.1.1"
description = "MyMail"
authors = ["pyjhoop"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mymail_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
thiserror = "2.0.21"
async-trait = "0.1.92"
tokio = { version = "1.53.2", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
imap = "2.4.1"
native-tls = "0.2.18"
mail-parser = { version = "0.11.9", features = ["full_encoding"] }
keyring = "4.2.0"
base64 = "0.22"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "native-tls"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# 토스트 색 링 이미지(PNG) 생성. 이미 tauri 의존성으로 빌드에 들어 있는 크레이트
png = "0.18"

# Windows 토스트(버튼·클릭 이벤트)를 직접 호출하기 위함 — tauri-plugin-notification은 데스크톱 버튼·클릭 미지원
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Data_Xml_Dom",
  "Foundation",
  "UI_Notifications",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Registry",
  "Win32_UI_Shell",
] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[lints.clippy]
all = { level = "warn", priority = -1 }
